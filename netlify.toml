# Netlify fallback host. Every public route is prerendered to dist/<route>/index.html,
# unknown URLs get dist/404.html with a real 404 status, and security/caching headers are
# generated into dist/_headers from vercel.json by scripts/prerender-seo.mjs (single source of truth).
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/discourses"
  to = "/gallery"
  status = 301

[[redirects]]
  from = "/legal/refund"
  to = "/legal/terms"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; media-src 'self'; connect-src 'self'; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'self'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"
